name: brucha_cafe
description: Brucha Coffee & Kitchen — Full-Featured QR Table Ordering App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1
  confetti: ^0.7.0

  # State & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0

  # QR
  qr_flutter: ^4.1.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
